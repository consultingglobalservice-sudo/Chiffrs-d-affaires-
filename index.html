<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord KPI — GSC Business Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #132540;
    --navy-dark: #0b1728;
    --navy-mid: #1e3a5f;
    --gold: #c9a24b;
    --gold-light: #f2e7cc;
    --green: #4c8a5e;
    --red: #c0504d;
    --amber: #e0a030;
    --blue: #2e5a88;
    --gray-50: #f7f7f8;
    --gray-100: #eff1f4;
    --gray-300: #d7d7dc;
    --gray-500: #8a8a93;
    --gray-700: #4a4a54;
    --white: #ffffff;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--navy); background: var(--gray-50);
  }
  #app { max-width: 1180px; margin: 0 auto; padding: 0 0 60px; }

  header.app {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: var(--white); padding: 22px 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px;
  }
  header.app .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  header.app h1 { margin: 4px 0 2px; font-size: 22px; font-weight: 700; }
  header.app p { margin: 0; font-size: 12.5px; color: var(--gold-light); opacity: .85; }
  .sync-box { display: flex; align-items: center; gap: 10px; }
  .sync-status { font-size: 11.5px; color: var(--gold-light); text-align: right; opacity: .9; }
  .btn {
    border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-gold { background: var(--gold); color: var(--navy-dark); }
  .btn-gold:hover { background: #d9b563; }
  .btn-outline { background: transparent; border: 1px solid var(--gray-300); color: var(--navy); }
  .btn-outline:hover { background: var(--gray-100); }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .btn:disabled { opacity: .55; cursor: default; }

  nav.tabs {
    background: var(--white); border-bottom: 1px solid var(--gray-300); display: flex; gap: 2px;
    padding: 0 20px; overflow-x: auto;
  }
  nav.tabs button {
    background: none; border: none; padding: 14px 14px; font-size: 13px; font-weight: 600; color: var(--gray-500);
    cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; font-family: inherit;
  }
  nav.tabs button:hover { color: var(--navy); }
  nav.tabs button.active { color: var(--navy); border-bottom-color: var(--gold); }

  main { padding: 20px 20px 10px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi-card {
    background: var(--white); border: 1px solid var(--gray-300); border-radius: var(--radius); padding: 14px 16px;
    border-top: 3px solid var(--gray-300);
  }
  .kpi-card.c-blue { border-top-color: var(--blue); }
  .kpi-card.c-gold { border-top-color: var(--gold); }
  .kpi-card.c-green { border-top-color: var(--green); }
  .kpi-card.c-red { border-top-color: var(--red); }
  .kpi-card.c-amber { border-top-color: var(--amber); }
  .kpi-label { font-size: 10.5px; color: var(--gray-500); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .kpi-value { font-size: 25px; font-weight: 800; color: var(--navy); margin-top: 4px; }
  .kpi-sub { font-size: 11px; color: var(--gray-500); margin-top: 2px; }

  .card {
    background: var(--white); border: 1px solid var(--gray-300); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 3px; color: var(--navy); font-weight: 700; }
  .card .card-sub { font-size: 12px; color: var(--gray-500); margin: 0 0 14px; }
  .two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .two-col { grid-template-columns: 1fr; } }
  .chart-wrap { position: relative; height: 260px; }
  .chart-wrap.tall { height: 320px; }

  table.simple { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.simple th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--gray-500); padding: 7px 8px; border-bottom: 2px solid var(--gray-300); }
  table.simple td { padding: 8px 8px; border-bottom: 1px solid var(--gray-100); }
  table.simple tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; color: var(--white); font-size: 11px; font-weight: 700; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .bar-label { width: 190px; font-size: 12px; color: var(--navy); flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--gray-100); border-radius: 6px; height: 16px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .bar-count { width: 60px; text-align: right; font-size: 12px; font-weight: 700; color: var(--navy); flex-shrink: 0; }

  .empty { padding: 30px 10px; text-align: center; color: var(--gray-500); font-size: 13px; }
  .stars { color: var(--gold); font-size: 16px; letter-spacing: 1px; }

  .config-screen { max-width: 640px; margin: 60px auto; padding: 0 20px; }
  .config-screen h2 { font-size: 18px; margin-bottom: 6px; }
  .config-screen p { font-size: 13px; color: var(--gray-700); line-height: 1.6; }
  .config-field { margin-bottom: 14px; }
  .config-field label { display: block; font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .config-field input { width: 100%; padding: 9px 11px; border: 1px solid var(--gray-300); border-radius: 8px; font-size: 12.5px; font-family: monospace; }
  .config-note { background: var(--gold-light); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--navy); margin: 14px 0; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--navy-dark); color: var(--white); padding: 10px 18px; border-radius: 30px; font-size: 12.5px;
    display: flex; align-items: center; gap: 8px; transition: transform .25s ease; z-index: 50;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

  .ca-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
  .ca-form .field { display: flex; flex-direction: column; gap: 4px; }
  .ca-form label { font-size: 10.5px; text-transform: uppercase; color: var(--gray-500); font-weight: 700; }
  .ca-form input { padding: 8px 10px; border: 1px solid var(--gray-300); border-radius: 7px; font-size: 13px; font-family: inherit; }
  .ca-form input[type="month"] { width: 140px; }
  .ca-form input[type="number"] { width: 130px; }
  .ca-form input[type="text"] { width: 220px; }
  .row-actions button { background: none; border: none; cursor: pointer; font-size: 13px; padding: 3px 6px; }
  .row-actions .del { color: var(--red); }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"><span class="dot"></span><span id="toast-text">Actualisé</span></div>

<script>
(function () {
  "use strict";

  // =========================================================
  // CONFIGURATION — URLs des 3 backends déjà déployés pour la
  // Plateforme Prospects et la Plateforme Accompagnements, plus le
  // nouveau backend (léger) dédié au chiffre d'affaires.
  // Ce tableau de bord est en LECTURE SEULE sur les 3 premiers — il ne
  // modifie jamais vos données de prospection ou d'accompagnement.
  // =========================================================
  const PROSPECTS_URL = "https://script.google.com/macros/s/AKfycbw7D54YswYtnIviQC7lVa0wqcM9QXBrAHY5Aa73lPEGND35uVsmGszBY_JO6j94p9H9/exec";
  const ESPACE_CLIENT_URL = "https://script.google.com/macros/s/AKfycbyC-7nFzTtEBbqZ0VRT-XT8VAfttdj3ivZjQEkRrwjNORWotTy8k59uRfMaftpdr47E/exec";
  const TEMOIGNAGES_URL = "https://script.google.com/macros/s/AKfycbxVDBL3lH6aYpUL7J5IOGNOcGBCKEiH_WvS-2cDXiBbUg5bAQAoktHddDODPKi22Lii1A/exec";
  // ⚠️ À CONFIGURER : déployez GSC_Backend_CA.gs (voir instructions dans ce
  // fichier) puis collez l'URL obtenue ci-dessous.
  const CA_URL = "https://script.google.com/macros/s/AKfycbwpqAkbKOMqyP9zModWzClZEN27VOoNFUchAFIJ5zIOyt7_bhJ3_SwwvVuw-ORZ-LVNog/exec";

  const STATUTS = [
    { id: "Nouveau prospect", color: "#2E5A88" },
    { id: "Contacté", color: "#8A6D3B" },
    { id: "RDV programmé", color: "#E0A030" },
    { id: "RDV réalisé (diagnostic fait)", color: "#6B4C8A" },
    { id: "Devis envoyé", color: "#C97A2B" },
    { id: "Signé / Client", color: "#4C8A5E" },
    { id: "Perdu / Sans réponse", color: "#C0504D" },
  ];
  const STATUT_COLORS = Object.fromEntries(STATUTS.map(s => [s.id, s.color]));

  const caConfigured = CA_URL.indexOf("REMPLACEZ") === -1;

  let prospects = [];      // depuis PROSPECTS_URL
  let clients = [];        // depuis ESPACE_CLIENT_URL (state.prospects)
  let sessions = [];
  let livrables = [];
  let temoignages = [];    // depuis TEMOIGNAGES_URL
  let caEntries = [];      // affiché = données serveur + file d'attente non synchronisée (voir recomputeCAEntries)

  let loaded = false;
  let syncing = false;
  let loadErrors = [];
  let lastSync = null;
  let activeTab = "overview";
  let charts = {}; // instances Chart.js actives, détruites avant chaque re-render

  const el = document.getElementById("app");

  // =========================================================
  // HELPERS
  // =========================================================
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtFCFA(n) {
    return Math.round(n || 0).toLocaleString("fr-FR") + " FCFA";
  }
  function monthKey(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    if (isNaN(d)) return String(dateStr).slice(0, 7);
    return d.toISOString().slice(0, 7);
  }
  function monthLabel(key) {
    if (!key) return "—";
    const [y, m] = key.split("-");
    const noms = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sep", "Oct", "Nov", "Déc"];
    return `${noms[Number(m) - 1] || m} ${y}`;
  }
  function lastNMonths(n) {
    const out = [];
    const now = new Date();
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push(d.toISOString().slice(0, 7));
    }
    return out;
  }
  function showToast(msg) {
    const t = document.getElementById("toast");
    document.getElementById("toast-text").textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2600);
  }
  function destroyCharts() {
    Object.values(charts).forEach(c => c && c.destroy());
    charts = {};
  }

  // =========================================================
  // API — lecture seule sur les 3 backends existants
  // =========================================================
  async function fetchProspects() {
    const res = await fetch(PROSPECTS_URL, { method: "GET" });
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "Erreur backend Prospects");
    return data.prospects || [];
  }
  async function fetchEspaceClient() {
    const res = await fetch(ESPACE_CLIENT_URL, { method: "GET" });
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "Erreur backend Espace Client");
    return {
      clients: data.prospects || [],
      sessions: data.sessions || [],
      livrables: data.livrables || [],
    };
  }
  async function fetchTemoignages() {
    const res = await fetch(TEMOIGNAGES_URL + "?status=all", { method: "GET" });
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "Erreur backend Témoignages");
    return data.temoignages || [];
  }
  async function parseJsonOrThrow(res) {
    if (!res.ok) throw new Error("Réponse HTTP " + res.status + " du backend CA");
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error("Réponse non-JSON du backend CA (URL mal configurée, ou déploiement pas encore autorisé) : " + text.slice(0, 120)); }
    if (data.status !== "ok") throw new Error(data.message || "Erreur backend CA inconnue");
    return data;
  }
  async function fetchCA() {
    if (!caConfigured) return [];
    const res = await fetch(CA_URL, { method: "GET" });
    const data = await parseJsonOrThrow(res);
    return data.entries || [];
  }
  async function apiUpsertCA(entry) {
    const res = await fetch(CA_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "upsert", entry: entry }),
    });
    await parseJsonOrThrow(res);
  }
  async function apiDeleteCA(id) {
    const res = await fetch(CA_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", id: id }),
    });
    await parseJsonOrThrow(res);
  }

  // =========================================================
  // SAUVEGARDE & SYNCHRONISATION AUTOMATIQUES DU CA
  // ---------------------------------------------------------
  // Toute saisie manuelle (ou suppression) est :
  //  1. appliquée immédiatement à l'écran (rien n'attend le réseau) ;
  //  2. enregistrée dans le navigateur (localStorage), donc jamais perdue
  //     même en cas de fermeture de la page avant synchronisation ;
  //  3. envoyée en arrière-plan au backend, avec réessai automatique
  //     toutes les 30 secondes jusqu'à confirmation.
  // =========================================================
  const CA_CACHE_KEY = "gsc_dashboard_ca_cache_v1";
  const CA_PENDING_KEY = "gsc_dashboard_ca_pending_v1";

  function loadCACache() { try { return JSON.parse(localStorage.getItem(CA_CACHE_KEY) || "[]"); } catch (e) { return []; } }
  function saveCACache(entries) { try { localStorage.setItem(CA_CACHE_KEY, JSON.stringify(entries)); } catch (e) {} }
  function loadCAPending() { try { return JSON.parse(localStorage.getItem(CA_PENDING_KEY) || "[]"); } catch (e) { return []; } }
  function saveCAPendingList(list) { try { localStorage.setItem(CA_PENDING_KEY, JSON.stringify(list)); } catch (e) {} }

  // Superpose les opérations pas encore confirmées par le serveur sur les
  // données serveur les plus récentes, pour que l'écran soit toujours à jour
  // même pendant une coupure réseau ou avant confirmation du backend.
  function applyPendingOverlay(serverEntries) {
    const pending = loadCAPending();
    let merged = serverEntries.slice();
    pending.forEach(op => {
      if (op.type === "upsert") {
        const idx = merged.findIndex(e => e.id === op.entry.id);
        const flagged = Object.assign({}, op.entry, { _pending: true });
        if (idx >= 0) merged[idx] = flagged; else merged.push(flagged);
      } else if (op.type === "delete") {
        merged = merged.filter(e => e.id !== op.id);
      }
    });
    return merged;
  }

  function queueCAOperation(op) {
    op._qid = "q" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const list = loadCAPending().filter(o =>
      !(o.type === "upsert" && op.type === "upsert" && o.entry.id === op.entry.id) &&
      !(o.type === "delete" && op.type === "delete" && o.id === op.id)
    );
    list.push(op);
    saveCAPendingList(list);
  }

  let caServerEntriesRaw = loadCACache(); // dernière version confirmée par le serveur (ou cache local au démarrage)
  function recomputeCAEntries() { caEntries = applyPendingOverlay(caServerEntriesRaw); }

  let caFlushing = false;
  let caLastError = null; // dernier message d'erreur rencontré, affiché dans l'onglet CA pour diagnostic
  async function flushCAQueue(silent) {
    if (!caConfigured || caFlushing) return;
    const list = loadCAPending();
    if (!list.length) return;
    caFlushing = true;
    let syncedCount = 0;
    for (const op of list) {
      try {
        if (op.type === "upsert") await apiUpsertCA(op.entry);
        else if (op.type === "delete") await apiDeleteCA(op.id);
        saveCAPendingList(loadCAPending().filter(o => o._qid !== op._qid));
        syncedCount++;
        caLastError = null;
      } catch (e) {
        caLastError = e.message;
        console.error("Synchronisation CA en attente — nouvel essai dans 30s :", e.message);
        if (!silent) showToast("Échec de synchronisation : " + e.message.slice(0, 80));
        break; // le backend est probablement indisponible : on retentera tout au prochain cycle
      }
    }
    caFlushing = false;
    if (syncedCount) {
      try { caServerEntriesRaw = await fetchCA(); saveCACache(caServerEntriesRaw); } catch (e) {}
      recomputeCAEntries();
      if (!silent && (activeTab === "ca" || activeTab === "overview")) render();
    } else if (activeTab === "ca") {
      render(); // pour afficher le message d'erreur mis à jour même si rien n'a été synchronisé
    }
  }
  setInterval(() => flushCAQueue(true), 30 * 1000);

  // Diagnostic manuel : interroge CA_URL directement et affiche la réponse
  // brute — utile pour identifier en un clic un problème de déploiement
  // (URL incorrecte, autorisation Google manquante, backend non déployé...).
  async function diagnoseCA() {
    if (!caConfigured) return { ok: false, detail: "CA_URL n'est pas configurée dans ce fichier." };
    try {
      const res = await fetch(CA_URL, { method: "GET" });
      const text = await res.text();
      let parsed = null;
      try { parsed = JSON.parse(text); } catch (e) {}
      if (!res.ok) return { ok: false, detail: `Le backend a répondu avec le code HTTP ${res.status}.` };
      if (!parsed) return { ok: false, detail: `Réponse reçue mais ce n'est pas du JSON valide — signe fréquent d'une page d'autorisation Google plutôt que votre script. Début de la réponse : "${text.slice(0, 200)}"` };
      if (parsed.status !== "ok") return { ok: false, detail: `Le backend a répondu une erreur : ${parsed.message || "raison inconnue"}` };
      return { ok: true, detail: `Connexion réussie — ${(parsed.entries || []).length} entrée(s) actuellement enregistrée(s) sur le backend.` };
    } catch (e) {
      return { ok: false, detail: `Impossible de contacter le backend (${e.message}). Vérifiez l'URL, votre connexion, ou si le déploiement Apps Script est bien actif.` };
    }
  }


  async function loadAll(silent) {
    if (!silent) syncing = true;
    if (!silent) render();
    loadErrors = [];
    const results = await Promise.allSettled([
      fetchProspects(), fetchEspaceClient(), fetchTemoignages(), fetchCA(),
    ]);
    if (results[0].status === "fulfilled") prospects = results[0].value;
    else loadErrors.push("Prospects : " + results[0].reason.message);

    if (results[1].status === "fulfilled") {
      clients = results[1].value.clients;
      sessions = results[1].value.sessions;
      livrables = results[1].value.livrables;
    } else loadErrors.push("Espace client : " + results[1].reason.message);

    if (results[2].status === "fulfilled") temoignages = results[2].value;
    else loadErrors.push("Témoignages : " + results[2].reason.message);

    if (results[3].status === "fulfilled") {
      caServerEntriesRaw = results[3].value;
      saveCACache(caServerEntriesRaw);
    } else if (caConfigured) {
      loadErrors.push("Chiffre d'affaires : " + results[3].reason.message);
      caServerEntriesRaw = loadCACache(); // on retombe sur la dernière copie connue plutôt que d'afficher du vide
    }
    recomputeCAEntries();

    lastSync = new Date();
    syncing = false;
    loaded = true;
    render();
    if (!silent && loadErrors.length === 0) showToast("Données actualisées");
  }

  // =========================================================
  // LOGIQUE MÉTIER — répliquée depuis les plateformes sources
  // pour rester rigoureusement cohérente avec les mêmes calculs
  // =========================================================
  function scoreOf(p) {
    const map = { "Oui": 2, "Partiel": 1, "Non": 0 };
    const a = map[p.offreTestee] ?? "";
    const b = map[p.structuration] ?? "";
    const c = map[p.acquisition] ?? "";
    if (a === "" && b === "" && c === "") return null;
    return (a || 0) + (b || 0) + (c || 0);
  }
  function isStepAutoDone(clientId, etapeId) {
    const hasLivrableThisStep = livrables.some(l => l.clientId === clientId && l.etape === etapeId);
    if (!hasLivrableThisStep) return false;
    const hasLivrableLaterStep = livrables.some(l => l.clientId === clientId && l.etape > etapeId);
    const hasSessionLaterStep = sessions.some(s => s.clientId === clientId && s.etape > etapeId);
    return hasLivrableLaterStep || hasSessionLaterStep;
  }
  function computeAutoEtape(clientId) {
    for (let n = 1; n <= 10; n++) if (!isStepAutoDone(clientId, n)) return n;
    return 10;
  }
  function effectiveEtape(c) {
    return Math.max(c.etape || 1, computeAutoEtape(c.id));
  }

  // =========================================================
  // RENDER — routeur d'onglets
  // =========================================================
  const TABS = [
    { id: "overview", label: "Vue d'ensemble" },
    { id: "pipeline", label: "Pipeline commercial" },
    { id: "accompagnement", label: "Accompagnement" },
    { id: "satisfaction", label: "Satisfaction" },
    { id: "ca", label: "Chiffre d'affaires" },
  ];

  function render() {
    if (!loaded) {
      el.innerHTML = `
        <header class="app">
          <div><div class="eyebrow">GSC BUSINESS CENTER</div><h1>Tableau de bord KPI</h1>
          <p>Chargement des données depuis vos 3 plateformes…</p></div>
        </header>
        <div class="empty" style="padding:60px 10px;">Connexion aux backends en cours…</div>`;
      return;
    }

    destroyCharts();
    el.innerHTML = `
      <header class="app">
        <div>
          <div class="eyebrow">GSC BUSINESS CENTER</div>
          <h1>Tableau de bord KPI</h1>
          <p>Vue consolidée du pipeline, de l'accompagnement, de la satisfaction et du chiffre d'affaires</p>
        </div>
        <div class="sync-box">
          <div class="sync-status">
            ${lastSync ? "Actualisé à " + lastSync.toLocaleTimeString("fr-FR").slice(0, 5) : ""}
            ${loadErrors.length ? `<br><span style="color:#e8a4a2;">${loadErrors.length} source(s) indisponible(s)</span>` : ""}
          </div>
          <button class="btn btn-gold btn-sm" id="btn-refresh" ${syncing ? "disabled" : ""}>${syncing ? "Actualisation…" : "↻ Actualiser"}</button>
        </div>
      </header>
      <nav class="tabs" id="tabs">
        ${TABS.map(t => `<button data-tab="${t.id}" class="${activeTab === t.id ? "active" : ""}">${t.label}</button>`).join("")}
      </nav>
      <main id="main"></main>
    `;
    document.getElementById("btn-refresh").addEventListener("click", () => loadAll(false));
    document.getElementById("tabs").addEventListener("click", e => {
      const b = e.target.closest("button[data-tab]");
      if (!b) return;
      activeTab = b.dataset.tab;
      render();
    });

    const main = document.getElementById("main");
    if (loadErrors.length) {
      main.innerHTML += `<div class="card" style="border-left:3px solid var(--red);">
        <h2 style="color:var(--red);">Certaines données n'ont pas pu être chargées</h2>
        <div class="card-sub">${loadErrors.map(esc).join(" · ")}</div>
      </div>`;
    }
    if (activeTab === "overview") renderOverview(main);
    if (activeTab === "pipeline") renderPipeline(main);
    if (activeTab === "accompagnement") renderAccompagnement(main);
    if (activeTab === "satisfaction") renderSatisfaction(main);
    if (activeTab === "ca") renderCA(main);
  }

  // =========================================================
  // ONGLET — VUE D'ENSEMBLE
  // =========================================================
  function renderOverview(main) {
    const total = prospects.length;
    const signes = prospects.filter(p => p.statut === "Signé / Client").length;
    const perdus = prospects.filter(p => p.statut === "Perdu / Sans réponse").length;
    const tauxConversion = total ? Math.round((signes / total) * 100) : 0;

    const thisMonth = new Date().toISOString().slice(0, 7);
    const nouveauxCeMois = prospects.filter(p => monthKey(p.dateSubmission) === thisMonth).length;

    const clientsActifs = clients.filter(c => effectiveEtape(c) < 10).length;
    const clientsTermines = clients.filter(c => effectiveEtape(c) === 10).length;

    const notes = temoignages.map(t => t.note).filter(n => n !== null && n !== undefined && n !== "");
    const noteMoyenne = notes.length ? (notes.reduce((a, b) => a + Number(b), 0) / notes.length).toFixed(1) : null;

    const caTotal = caEntries.reduce((a, e) => a + (Number(e.montant) || 0), 0);
    const caCeMoisMontant = caEntries.filter(e => e.mois === thisMonth).reduce((a, e) => a + (Number(e.montant) || 0), 0);

    main.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card c-blue"><div class="kpi-label">Prospects totaux</div><div class="kpi-value">${total}</div><div class="kpi-sub">+${nouveauxCeMois} ce mois-ci</div></div>
        <div class="kpi-card c-gold"><div class="kpi-label">Taux de conversion</div><div class="kpi-value">${tauxConversion}%</div><div class="kpi-sub">${signes} signé(s) sur ${total}</div></div>
        <div class="kpi-card c-green"><div class="kpi-label">Clients actifs</div><div class="kpi-value">${clientsActifs}</div><div class="kpi-sub">${clientsTermines} accompagnement(s) terminé(s)</div></div>
        <div class="kpi-card c-amber"><div class="kpi-label">Satisfaction moyenne</div><div class="kpi-value">${noteMoyenne ? noteMoyenne + " / 5" : "—"}</div><div class="kpi-sub">${notes.length} avis reçus</div></div>
        <div class="kpi-card c-red"><div class="kpi-label">Prospects perdus</div><div class="kpi-value">${perdus}</div><div class="kpi-sub">sur ${total} au total</div></div>
        <div class="kpi-card c-blue"><div class="kpi-label">CA du mois</div><div class="kpi-value" style="font-size:19px;">${caCeMoisMontant ? fmtFCFA(caCeMoisMontant) : "—"}</div><div class="kpi-sub">${fmtFCFA(caTotal)} cumulé</div></div>
      </div>

      <div class="two-col">
        <div class="card">
          <h2>Nouveaux prospects par mois</h2>
          <p class="card-sub">6 derniers mois, source : Plateforme Prospection</p>
          <div class="chart-wrap"><canvas id="chart-monthly"></canvas></div>
        </div>
        <div class="card">
          <h2>Répartition du pipeline</h2>
          <p class="card-sub">Statut actuel de tous les prospects</p>
          <div class="chart-wrap"><canvas id="chart-pipeline-donut"></canvas></div>
        </div>
      </div>

      <div class="card">
        <h2>À traiter en priorité</h2>
        <p class="card-sub">Ce qui mérite votre attention aujourd'hui</p>
        ${renderPriorities()}
      </div>
    `;

    const months = lastNMonths(6);
    const counts = months.map(m => prospects.filter(p => monthKey(p.dateSubmission) === m).length);
    charts.monthly = new Chart(document.getElementById("chart-monthly"), {
      type: "bar",
      data: { labels: months.map(monthLabel), datasets: [{ label: "Nouveaux prospects", data: counts, backgroundColor: "#c9a24b", borderRadius: 4 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
    });

    const pipelineCounts = STATUTS.map(s => prospects.filter(p => p.statut === s.id).length);
    charts.pipelineDonut = new Chart(document.getElementById("chart-pipeline-donut"), {
      type: "doughnut",
      data: { labels: STATUTS.map(s => s.id), datasets: [{ data: pipelineCounts, backgroundColor: STATUTS.map(s => s.color) }] },
      options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10.5 } } } } },
    });
  }

  function renderPriorities() {
    const items = [];
    const devisEnAttente = prospects.filter(p => p.statut === "Devis envoyé").length;
    if (devisEnAttente) items.push(`${devisEnAttente} devis envoyé(s) en attente de relance`);
    const rdvProgrammes = prospects.filter(p => p.statut === "RDV programmé").length;
    if (rdvProgrammes) items.push(`${rdvProgrammes} rendez-vous programmé(s) à venir`);
    const temoignagesEnAttente = temoignages.filter(t => t.statutApprobation !== "approuve" && t.statutApprobation !== "rejete").length;
    if (temoignagesEnAttente) items.push(`${temoignagesEnAttente} témoignage(s) en attente d'approbation (Plateforme Accompagnements)`);
    const nouveaux = prospects.filter(p => p.statut === "Nouveau prospect").length;
    if (nouveaux) items.push(`${nouveaux} nouveau(x) prospect(s) pas encore contacté(s)`);
    if (!caConfigured) items.push(`Backend Chiffre d'affaires non configuré — voir l'onglet "Chiffre d'affaires"`);
    const caPendingCount = loadCAPending().length;
    if (caPendingCount) items.push(`${caPendingCount} entrée(s) de chiffre d'affaires en attente de synchronisation avec Google Sheets`);

    if (!items.length) return `<div class="empty">Rien d'urgent — tout est à jour.</div>`;
    return `<table class="simple"><tbody>${items.map(i => `<tr><td>• ${esc(i)}</td></tr>`).join("")}</tbody></table>`;
  }

  // =========================================================
  // ONGLET — PIPELINE COMMERCIAL
  // =========================================================
  function renderPipeline(main) {
    const total = prospects.length;
    const scores = prospects.map(scoreOf).filter(s => s !== null);
    const scoreMoyen = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : "—";

    const canaux = {};
    prospects.forEach(p => { const c = p.canal || "Non renseigné"; canaux[c] = canaux[c] || { total: 0, signes: 0 }; canaux[c].total++; if (p.statut === "Signé / Client") canaux[c].signes++; });
    const canalRows = Object.entries(canaux).sort((a, b) => b[1].total - a[1].total);

    const secteurs = {};
    prospects.forEach(p => { const s = p.secteur || "Non renseigné"; secteurs[s] = (secteurs[s] || 0) + 1; });
    const secteurRows = Object.entries(secteurs).sort((a, b) => b[1] - a[1]);

    main.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card c-blue"><div class="kpi-label">Total prospects</div><div class="kpi-value">${total}</div></div>
        <div class="kpi-card c-red"><div class="kpi-label">Score structuration moyen</div><div class="kpi-value">${scoreMoyen}${scores.length ? " / 6" : ""}</div></div>
        <div class="kpi-card c-gold"><div class="kpi-label">Canaux actifs</div><div class="kpi-value">${Object.keys(canaux).length}</div></div>
      </div>

      <div class="card">
        <h2>Entonnoir du pipeline</h2>
        <p class="card-sub">Nombre de prospects par statut</p>
        <div id="funnel"></div>
      </div>

      <div class="two-col">
        <div class="card">
          <h2>Performance par canal d'acquisition</h2>
          <p class="card-sub">Volume de prospects et taux de conversion par canal</p>
          <table class="simple">
            <thead><tr><th>Canal</th><th>Prospects</th><th>Signés</th><th>Conversion</th></tr></thead>
            <tbody>
              ${canalRows.map(([c, d]) => `<tr><td>${esc(c)}</td><td>${d.total}</td><td>${d.signes}</td><td>${d.total ? Math.round(d.signes / d.total * 100) : 0}%</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Aucune donnée</td></tr>`}
            </tbody>
          </table>
        </div>
        <div class="card">
          <h2>Répartition par secteur</h2>
          <p class="card-sub">Secteurs d'activité des prospects</p>
          <div class="chart-wrap"><canvas id="chart-secteurs"></canvas></div>
        </div>
      </div>
    `;

    const maxCount = Math.max(1, ...STATUTS.map(s => prospects.filter(p => p.statut === s.id).length));
    document.getElementById("funnel").innerHTML = STATUTS.map(s => {
      const count = prospects.filter(p => p.statut === s.id).length;
      const pct = Math.round((count / maxCount) * 100);
      return `<div class="bar-row">
        <div class="bar-label">${esc(s.id)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${s.color};"></div></div>
        <div class="bar-count">${count}</div>
      </div>`;
    }).join("");

    charts.secteurs = new Chart(document.getElementById("chart-secteurs"), {
      type: "pie",
      data: {
        labels: secteurRows.map(r => r[0]),
        datasets: [{ data: secteurRows.map(r => r[1]), backgroundColor: ["#132540", "#c9a24b", "#2E5A88", "#6B4C8A", "#4C8A5E", "#C97A2B", "#8A6D3B", "#C0504D", "#E0A030"] }],
      },
      options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } },
    });
  }

  // =========================================================
  // ONGLET — ACCOMPAGNEMENT
  // =========================================================
  function renderAccompagnement(main) {
    const total = clients.length;
    const etapes = clients.map(effectiveEtape);
    const enCours = etapes.filter(e => e < 10).length;
    const termines = etapes.filter(e => e === 10).length;
    const missionsActives = sessions.filter(s => new Date(s.date || s.dateSession || 0) >= new Date(Date.now() - 30 * 86400000)).length;

    const parEtape = {};
    for (let n = 1; n <= 10; n++) parEtape[n] = etapes.filter(e => e === n).length;

    const NOMS_ETAPES = ["Clarification", "Validation marché", "Structuration", "Positionnement", "Acquisition", "Conversion", "Livraison", "Automatisation", "Développement", "Impact/Liberté"];

    main.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card c-blue"><div class="kpi-label">Clients accompagnés</div><div class="kpi-value">${total}</div></div>
        <div class="kpi-card c-gold"><div class="kpi-label">Accompagnements en cours</div><div class="kpi-value">${enCours}</div></div>
        <div class="kpi-card c-green"><div class="kpi-label">Parcours terminés (10/10)</div><div class="kpi-value">${termines}</div></div>
        <div class="kpi-card c-amber"><div class="kpi-label">Livrables déposés</div><div class="kpi-value">${livrables.length}</div></div>
      </div>

      <div class="card">
        <h2>Répartition des clients par étape de la méthode GSC</h2>
        <p class="card-sub">Où en sont vos clients dans le parcours en 10 étapes</p>
        <div id="etapes-bars"></div>
      </div>
    `;

    const max = Math.max(1, ...Object.values(parEtape));
    document.getElementById("etapes-bars").innerHTML = NOMS_ETAPES.map((nom, i) => {
      const n = i + 1;
      const count = parEtape[n];
      const pct = Math.round((count / max) * 100);
      return `<div class="bar-row">
        <div class="bar-label">${n}. ${esc(nom)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${n === 10 ? "#4C8A5E" : "#c9a24b"};"></div></div>
        <div class="bar-count">${count}</div>
      </div>`;
    }).join("") || `<div class="empty">Aucun client dans l'espace d'accompagnement pour le moment.</div>`;
  }

  // =========================================================
  // ONGLET — SATISFACTION
  // =========================================================
  function renderSatisfaction(main) {
    const total = temoignages.length;
    const notes = temoignages.map(t => t.note).filter(n => n !== null && n !== undefined && n !== "");
    const moyenne = notes.length ? (notes.reduce((a, b) => a + Number(b), 0) / notes.length).toFixed(1) : null;
    const autorises = temoignages.filter(t => t.autorisation === "oui").length;
    const tauxRecommandation = total ? Math.round((autorises / total) * 100) : 0;
    const enAttente = temoignages.filter(t => t.statutApprobation !== "approuve" && t.statutApprobation !== "rejete").length;
    const approuves = temoignages.filter(t => t.statutApprobation === "approuve").length;

    const repartition = [5, 4, 3, 2, 1].map(n => temoignages.filter(t => Number(t.note) === n).length);

    main.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card c-gold"><div class="kpi-label">Note moyenne</div><div class="kpi-value">${moyenne ? moyenne + " / 5" : "—"}</div><div class="kpi-sub">${notes.length} note(s)</div></div>
        <div class="kpi-card c-green"><div class="kpi-label">Taux de recommandation</div><div class="kpi-value">${tauxRecommandation}%</div><div class="kpi-sub">autorisent la publication</div></div>
        <div class="kpi-card c-amber"><div class="kpi-label">En attente d'approbation</div><div class="kpi-value">${enAttente}</div><div class="kpi-sub">à traiter dans Accompagnements</div></div>
        <div class="kpi-card c-blue"><div class="kpi-label">Publiés sur le site</div><div class="kpi-value">${approuves}</div></div>
      </div>

      <div class="two-col">
        <div class="card">
          <h2>Répartition des notes</h2>
          <p class="card-sub">Toutes les réponses au questionnaire de satisfaction</p>
          <div id="notes-bars"></div>
        </div>
        <div class="card">
          <h2>Derniers témoignages</h2>
          <p class="card-sub">5 plus récents</p>
          <table class="simple">
            <thead><tr><th>Client</th><th>Note</th><th>Statut</th></tr></thead>
            <tbody>
              ${[...temoignages].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0)).slice(0, 5).map(t => `
                <tr><td>${esc(t.nomComplet || "—")}</td><td>${t.note ? "★".repeat(t.note) : "—"}</td>
                <td>${t.statutApprobation === "approuve" ? "Approuvé" : t.statutApprobation === "rejete" ? "Rejeté" : "En attente"}</td></tr>
              `).join("") || `<tr><td colspan="3" class="empty">Aucun témoignage</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;

    const max = Math.max(1, ...repartition);
    document.getElementById("notes-bars").innerHTML = [5, 4, 3, 2, 1].map((n, i) => {
      const count = repartition[i];
      const pct = Math.round((count / max) * 100);
      return `<div class="bar-row">
        <div class="bar-label">${"★".repeat(n)}${"☆".repeat(5 - n)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#c9a24b;"></div></div>
        <div class="bar-count">${count}</div>
      </div>`;
    }).join("");
  }

  // =========================================================
  // ONGLET — CHIFFRE D'AFFAIRES
  // =========================================================
  function renderCA(main) {
    if (!caConfigured) {
      main.innerHTML = `
        <div class="config-screen" style="margin-top:20px;">
          <h2>Backend Chiffre d'affaires non configuré</h2>
          <p>Le CA n'est actuellement suivi nulle part dans votre écosystème GSC — ni dans le CRM, ni dans la Plateforme Accompagnements. Ce module dédié comble ce manque.</p>
          <div class="config-note">
            1. Déployez le fichier <b>GSC_Backend_CA.gs</b> fourni comme Application Web (mêmes étapes que vos autres backends).<br>
            2. Copiez l'URL obtenue.<br>
            3. Collez-la dans la constante <code>CA_URL</code> en haut de ce fichier, puis republiez la page.
          </div>
        </div>`;
      return;
    }

    const months = lastNMonths(12);
    // Plusieurs entrées peuvent partager le même mois (une par client signé,
    // plus d'éventuelles entrées manuelles) — on agrège par somme.
    const sumByMonth = {};
    caEntries.forEach(e => { sumByMonth[e.mois] = (sumByMonth[e.mois] || 0) + (Number(e.montant) || 0); });
    const total = caEntries.reduce((a, e) => a + (Number(e.montant) || 0), 0);
    const moisAvecCA = Object.keys(sumByMonth).length;
    const moyenne = moisAvecCA ? total / moisAvecCA : 0;
    const thisMonth = new Date().toISOString().slice(0, 7);
    const lastMonth = lastNMonths(2)[0];
    const totalThisMonth = sumByMonth[thisMonth] || 0;
    const totalLastMonth = sumByMonth[lastMonth] || 0;
    const evolution = (totalLastMonth && totalThisMonth)
      ? Math.round(((totalThisMonth - totalLastMonth) / totalLastMonth) * 100)
      : null;
    const nbAuto = caEntries.filter(e => e.source && e.source.indexOf("Auto") === 0).length;

    const pendingCount = loadCAPending().length;

    main.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card c-green"><div class="kpi-label">CA cumulé</div><div class="kpi-value" style="font-size:19px;">${fmtFCFA(total)}</div></div>
        <div class="kpi-card c-gold"><div class="kpi-label">Moyenne mensuelle</div><div class="kpi-value" style="font-size:19px;">${fmtFCFA(moyenne)}</div></div>
        <div class="kpi-card c-blue"><div class="kpi-label">CA ce mois-ci</div><div class="kpi-value" style="font-size:19px;">${totalThisMonth ? fmtFCFA(totalThisMonth) : "—"}</div></div>
        <div class="kpi-card ${evolution === null ? "" : evolution >= 0 ? "c-green" : "c-red"}"><div class="kpi-label">Évolution vs mois dernier</div><div class="kpi-value">${evolution === null ? "—" : (evolution >= 0 ? "+" : "") + evolution + "%"}</div></div>
      </div>

      <div class="card">
        <h2>Évolution du chiffre d'affaires</h2>
        <p class="card-sub">12 derniers mois — ${nbAuto} vente(s) comptabilisée(s) automatiquement depuis la Plateforme Prospection (prospects passés à "Signé / Client")</p>
        <div class="chart-wrap tall"><canvas id="chart-ca"></canvas></div>
      </div>

      <div class="card">
        <h2>Ajouter une entrée manuelle</h2>
        <p class="card-sub">Les ventes signées dans la Plateforme Prospection sont comptabilisées automatiquement ci-dessous. Utilisez ce formulaire uniquement pour du CA hors devis GSC (ex. formation, partenariat).</p>
        ${pendingCount ? `<div class="config-note">⏳ ${pendingCount} entrée(s) enregistrée(s) localement, en cours de synchronisation avec Google Sheets (nouvel essai automatique toutes les 30 secondes).</div>` : ""}
        ${caLastError ? `<div class="config-note" style="background:#FBE4E1;color:#8A2E2A;">⚠️ Dernière erreur de synchronisation : ${esc(caLastError)}</div>` : ""}
        <button class="btn btn-outline btn-sm" id="ca-diagnose" style="margin-bottom:14px;">🔍 Tester la connexion au backend</button>
        <div id="ca-diagnose-result"></div>
        <div class="ca-form">
          <div class="field"><label>Mois</label><input type="month" id="ca-mois" value="${thisMonth}"></div>
          <div class="field"><label>Montant (FCFA)</label><input type="number" id="ca-montant" min="0" step="1000"></div>
          <div class="field"><label>Client / libellé</label><input type="text" id="ca-client" placeholder="ex. Formation 7 jours — Mamadou Ba"></div>
          <div class="field"><label>Note (facultatif)</label><input type="text" id="ca-note" placeholder="ex. Acompte 50%"></div>
          <button class="btn btn-gold" id="ca-save">Enregistrer</button>
        </div>
        <table class="simple">
          <thead><tr><th>Mois</th><th>Client</th><th>Montant</th><th>Source</th><th>Note</th><th></th></tr></thead>
          <tbody>
            ${[...caEntries].sort((a, b) => b.mois.localeCompare(a.mois) || (b.dateEnregistrement || "").localeCompare(a.dateEnregistrement || "")).map(e => `
              <tr>
                <td>${esc(monthLabel(e.mois))}</td>
                <td>${esc(e.client || "—")}</td>
                <td>${fmtFCFA(e.montant)}</td>
                <td>${e._pending ? `<span class="badge" style="background:var(--amber);">En attente</span>` : e.source && e.source.indexOf("Auto") === 0 ? `<span class="badge" style="background:#4C8A5E;">Auto</span>` : `<span class="badge" style="background:var(--gray-500);">Manuel</span>`}</td>
                <td>${esc(e.note || "—")}</td>
                <td class="row-actions"><button class="del" data-del="${esc(e.id)}">✕</button></td>
              </tr>
            `).join("") || `<tr><td colspan="6" class="empty">Aucune donnée enregistrée</td></tr>`}
          </tbody>
        </table>
      </div>
    `;

    charts.ca = new Chart(document.getElementById("chart-ca"), {
      type: "bar",
      data: {
        labels: months.map(monthLabel),
        datasets: [{ label: "CA (FCFA)", data: months.map(m => sumByMonth[m] || 0), backgroundColor: "#132540", borderRadius: 4 }],
      },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString("fr-FR") } } } },
    });

    document.getElementById("ca-diagnose").addEventListener("click", async () => {
      const box = document.getElementById("ca-diagnose-result");
      box.innerHTML = `<div class="card-sub">Test en cours…</div>`;
      const result = await diagnoseCA();
      box.innerHTML = `<div class="config-note" style="background:${result.ok ? "#E3EFE8" : "#FBE4E1"};color:${result.ok ? "#2E5A3D" : "#8A2E2A"};">${result.ok ? "✅" : "❌"} ${esc(result.detail)}</div>`;
    });

    document.getElementById("ca-save").addEventListener("click", () => {
      const btn = document.getElementById("ca-save");
      const mois = document.getElementById("ca-mois").value;
      const montant = Number(document.getElementById("ca-montant").value);
      const client = document.getElementById("ca-client").value.trim();
      const note = document.getElementById("ca-note").value.trim();
      if (!mois) { showToast("Renseignez le mois"); return; }
      if (!montant || isNaN(montant) || montant <= 0) { showToast("Renseignez un montant valide (supérieur à 0)"); return; }
      btn.disabled = true;
      const entry = { id: "manual_" + Date.now(), mois, montant, client, note, source: "Manuel" };
      // 1. Appliqué immédiatement à l'écran, 2. sauvegardé localement,
      // 3. synchronisé en arrière-plan (ne bloque jamais la saisie suivante).
      queueCAOperation({ type: "upsert", entry });
      recomputeCAEntries();
      showToast("Enregistré — synchronisation en arrière-plan");
      render();
      flushCAQueue();
    });

    main.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (!confirm("Supprimer cette entrée de chiffre d'affaires ?")) return;
        const id = btn.dataset.del;
        queueCAOperation({ type: "delete", id });
        recomputeCAEntries();
        showToast("Suppression enregistrée — synchronisation en arrière-plan");
        render();
        flushCAQueue();
      });
    });
  }

  // =========================================================
  // INIT — actualisation automatique toutes les 5 minutes
  // =========================================================
  recomputeCAEntries(); // affichage initial depuis le cache local, avant même la 1ère synchronisation réseau
  loadAll(false);
  setInterval(() => loadAll(true), 5 * 60 * 1000);
  setTimeout(() => flushCAQueue(true), 3000); // tente de vider une éventuelle file en attente dès l'ouverture
})();
</script>
</body>
</html>
